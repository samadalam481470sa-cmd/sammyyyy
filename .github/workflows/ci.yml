name: CI

# Typecheck, lint and the full test suite (including the MongoDB test, which downloads
# a MongoDB binary and so cannot run in sandboxes without that network access).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npx vitest run
