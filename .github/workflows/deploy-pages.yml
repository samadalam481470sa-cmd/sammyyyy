name: Deploy demo to GitHub Pages

# The live site is served from the gh-pages branch (Settings > Pages > Deploy from a branch).
# Every push to main builds the app and publishes dist/ to gh-pages, so the live link
# always matches main. Same steps as `npm run deploy:pages`.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:desktop
      - run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish dist to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1
          git worktree add pages FETCH_HEAD
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r dist/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Live site already matches this build."
          else
            git commit -m "Deploy ${GITHUB_SHA::7} to GitHub Pages"
            git push origin HEAD:gh-pages
          fi
