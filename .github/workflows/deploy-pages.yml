name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - cursor/newport-acquisition-dashboard-0d46
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          STATIC_DEMO: '1'
          VITE_STATIC_DEMO: '1'
      - run: cp dist/index.html dist/404.html
      # Pages must already be enabled in repo Settings → Pages → Source: GitHub Actions.
      # Do not pass enablement:true — the workflow token cannot create the Pages site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
