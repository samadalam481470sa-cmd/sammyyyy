<!doctype html>
<html>
  <body>
    <h1>Software Engineer</h1>
    <form id="application">
      <label for="first_name">First name *</label>
      <input id="first_name" name="first_name" required />
      <label for="last_name">Last name *</label>
      <input id="last_name" name="last_name" required />
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" />
      <label for="resume">Resume/CV</label>
      <input id="resume" name="resume" type="file" />
      <label for="hear">How did you hear about this job?</label>
      <input id="hear" name="hear" />
      <label for="auth">Are you legally authorized to work in the US?</label>
      <select id="auth" name="auth"><option>Yes</option><option>No</option></select>
      <button type="submit">Submit Application</button>
    </form>
  </body>
</html>
